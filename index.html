    <script type="importmap">
      {
        "imports": {
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",

        }

    <style>
      @keyframes float3d {
        0% {
          transform: translateY(0px) translateZ(0px) rotateX(0deg) rotateY(0deg);
          opacity: 0.2;
        }
        50% {
          transform: translateY(-40px) translateZ(60px) rotateX(180deg) rotateY(180deg);
          opacity: 0.5;
        }
        100% {
          transform: translateY(0px) translateZ(0px) rotateX(360deg) rotateY(360deg);
          opacity: 0.2;
        }
      }
      .math-symbol {
        position: absolute;
        font-size: 2.5rem;
        font-weight: bold;
        color: rgba(255, 255, 255, 0.4);
        animation: float3d 15s ease-in-out infinite;
        text-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        user-select: none;
        transform-style: preserve-3d;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .fade-in-content {
        animation: fadeIn 0.5s ease-in-out;
      }

      @keyframes popIn {
        0% { opacity: 0; transform: scale(0.9); }
        100% { opacity: 1; transform: scale(1); }
      }
      .pop-in {
        animation: popIn 0.3s ease-out forwards;
      }
    </style>
</head>
